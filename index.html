<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Digital Signage Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=m2v8p2">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header: Time & Weather -->
        <header>
            <div class="clock-section">
                <div id="time">00:00</div>
                <div id="date">Monday, January 1</div>
            </div>
            <div class="weather-section">
                <div id="weather-temp">22°C</div>
                <div id="weather-desc">Sunny</div>
            </div>
        </header>

        <!-- Main Content: Welcome Message -->
        <main>
            <div class="welcome-container">
                <h1 id="welcome-msg">Welcome to The Skoop</h1>
                <p id="sub-msg">Innovation starts here.</p>
            </div>
        </main>

        <!-- Footer: News Ticker -->
        <footer>
            <div class="ticker-label">LATEST NEWS</div>
            <div class="ticker-wrap">
                <div class="ticker" id="news-ticker">
                    <span class="ticker-item">Loading latest updates...</span>
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js?v=m2v8p2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
